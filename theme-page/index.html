    <h1>欢迎来到我的世界</h1>

    <h2>游戏简介</h2>
    <p>《我的世界》是一款沙盒创造类游戏，玩家可以在三维方块世界里自由地建造、探索与冒险。没有固定的通关目标，你可以按照自己的想法打造属于自己的世界。</p >
    <p>这款游戏拥有生存、创造、冒险等多种模式，适合不同喜好的玩家，也是全世界最受欢迎的独立游戏之一。</p >

    <h2>游戏特色</h2>
    <ul>
        <li>无限生成的开放方块世界，可以自由探索</li>
        <li>丰富的生存玩法：挖矿、打怪、种植、养殖</li>
        <li>强大的建造系统，从小屋到城堡都可以实现</li>
    </ul>
